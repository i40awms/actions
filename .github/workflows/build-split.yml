# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      cache_key:
        description: "Cache key"
        required: true
        type: string
      image_name:
        description: "Repository short name"
        required: true
        type: string
      in_memory:
        description: "Use in-memory docker"
        required: false
        type: boolean
        default: false
      in_memory_docker_size:
        description: "Use in-memory docker"
        required: false
        type: number
        default: 2
      in_memory_workdir_size:
        description: "Use in-memory docker"
        required: false
        type: number
        default: 1
      no_cache:
        description: "No cache"
        required: false
        type: boolean
        default: false

      dockerfile:
        description: "Dockerfile path"
        required: false
        type: string
        default: "./docker/dockerfile.production"
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: ""
      image_tag:
        description: "Override image tag"
        required: false
        type: string
      update_qemu:
        required: false
        type: boolean
        default: false
      build-args:
        required: false
        type: string
        default: ""
      trigger_infra:
        description: "Trigger CD"
        required: false
        type: boolean
        default: true

      # --- Branch gating policy (centralized; opt-out via gate: false) -------
      # When `gate` is true (default):
      #   - main / develop / roadmap/*  -> always build, the `gate` job is
      #     SKIPPED via a cheap job-level `if` (no self-hosted machine).
      #   - sprint* / epic*             -> the `gate` job runs check-pinned and
      #     decides (epic branches are matched via the S3 epic registry).
      #   - any other branch on push    -> gate skipped AND build skipped:
      #     nothing runs.
      # PRs (pull_request) do NOT build: a branch only builds when it is actually
      # pinned/deployed somewhere (or is main/develop/roadmap). Non-push,
      # non-PR events (workflow_dispatch/schedule/repository_dispatch) still
      # always build as a manual escape hatch. With `gate: false` the gate job is
      # skipped and the build always runs (the pre-gating behaviour).
      gate:
        description: "Apply the branch gating policy (see workflow header)."
        required: false
        type: boolean
        default: true
      gate_component:
        description: "Component key for the check-pinned lookup. Empty => use image_name."
        required: false
        type: string
        default: ""
      registry_bucket:
        description: "S3 bucket holding the epic registry (epic-envs/active.json). Epic envs live in the wip stack."
        required: false
        type: string
        default: "awms-fleets-wip-config"
      registry_key:
        description: "S3 key of the epic registry object."
        required: false
        type: string
        default: "epic-envs/active.json"
      aws_region:
        description: "AWS region for the epic-registry S3 read."
        required: false
        type: string
        default: "eu-south-1"
    secrets:
      INFRA_TOKEN:
        required: true
      IMG_REGISTRY:
        required: true
    outputs:
      image_name:
        description: "The first output string"
        value: ${{ jobs.tag.outputs.image_name }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # Gate: decides whether the (expensive) build should run for the gated
  # branches (sprint* / epic*). The always-build set (main / develop /
  # roadmap/*) and non-push, non-PR events (workflow_dispatch/schedule) are
  # resolved by the build jobs' own `if` expression, so this job is SKIPPED for
  # them and no self-hosted machine is spun up. Any other branch (incl. PRs)
  # matches neither, so the gate is skipped and (with no `should_build` output)
  # the build is skipped too. Skipped entirely when `gate: false`.
  gate:
    if: >-
      inputs.gate &&
      github.event_name == 'push' &&
      (
        startsWith(github.ref_name, 'sprint') ||
        startsWith(github.ref_name, 'epic')
      )
    runs-on: [self-hosted, linux, ligth]
    outputs:
      should_build: ${{ steps.pinned.outputs.should_build }}
    steps:
      - name: Check if branch is pinned in an infra environment
        id: pinned
        uses: i40awms/actions/.github/actions/check-pinned@develop
        with:
          branch: ${{ github.ref_name }}
          component: ${{ inputs.gate_component != '' && inputs.gate_component || inputs.image_name }}
          infra_token: ${{ secrets.INFRA_TOKEN }}
          registry_bucket: ${{ inputs.registry_bucket }}
          registry_key: ${{ inputs.registry_key }}
          aws_region: ${{ inputs.aws_region }}

  build-arm64:
    needs: gate
    # Build when gating is off, on non-push non-PR events (manual/scheduled),
    # for the always-build set (gate skipped → no machine), or when the gate
    # found the branch pinned. PRs are intentionally excluded so a branch only
    # builds when it is actually deployed somewhere.
    # `always()` lets us run even though `gate` is skipped for those cases.
    if: >-
      always() &&
      (
        !inputs.gate ||
        (github.event_name != 'push' && github.event_name != 'pull_request') ||
        github.ref_name == 'main' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'roadmap/') ||
        needs.gate.outputs.should_build == 'true'
      )
    uses: i40awms/actions/.github/workflows/build-platform.yml@develop
    with:
      cache_key: ${{ inputs.cache_key }}
      image_name: ${{ inputs.image_name }}
      in_memory: ${{ inputs.in_memory }}
      in_memory_docker_size: ${{ inputs.in_memory_docker_size }}
      in_memory_workdir_size: ${{ inputs.in_memory_workdir_size }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_tag: ${{ inputs.image_tag }}
      build-args: ${{ inputs.build-args }}
      no_cache: ${{ inputs.no_cache }}
      platform: arm64

    secrets:
      IMG_REGISTRY: ${{ secrets.IMG_REGISTRY }}

  build-amd64:
    needs: gate
    if: >-
      always() &&
      (
        !inputs.gate ||
        (github.event_name != 'push' && github.event_name != 'pull_request') ||
        github.ref_name == 'main' ||
        github.ref_name == 'develop' ||
        startsWith(github.ref_name, 'roadmap/') ||
        needs.gate.outputs.should_build == 'true'
      )
    uses: i40awms/actions/.github/workflows/build-platform.yml@develop
    with:
      cache_key: ${{ inputs.cache_key }}
      image_name: ${{ inputs.image_name }}
      in_memory: ${{ inputs.in_memory }}
      in_memory_docker_size: ${{ inputs.in_memory_docker_size }}
      in_memory_workdir_size: ${{ inputs.in_memory_workdir_size }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_tag: ${{ inputs.image_tag }}
      build-args: ${{ inputs.build-args }}
      no_cache: ${{ inputs.no_cache }}
      
      platform: amd64
    secrets:
      IMG_REGISTRY: ${{ secrets.IMG_REGISTRY }}

  # This workflow contains a single job called "build"
  tag:
    # The type of runner that the job will run on
    runs-on: [self-hosted, linux, ligth]
    needs:
      - build-arm64
      - build-amd64
    # Without an explicit `if`, this job defaults to `success()`, which walks the
    # WHOLE needs graph transitively. When `gate` is skipped (e.g. push on
    # main/develop/roadmap), that skipped ancestor makes `success()` false and
    # `tag` is skipped too -> no combined manifest, no INFRA CD trigger. Override
    # with always() and gate only on the direct build jobs succeeding.
    if: >-
      always() &&
      needs.build-arm64.result == 'success' &&
      needs.build-amd64.result == 'success'

    outputs:
      image_name: ${{ inputs.image_name }}:${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - run: |
          REF_NAME=${REF_NAME##*/}
          echo "REF_NAME=$REF_NAME" >> $GITHUB_OUTPUT
        id: ref_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}

      - run: |
          echo "LOCAL_PLATFORMS=$PLATFORMS" >> $GITHUB_OUTPUT
        id: local_platforms
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms == '' && 'linux/amd64,linux/arm64' || inputs.platforms }}

      # Il manifest multi-arch e l'eventuale custom tag sono anch'essi tag ECR
      # IMMUTABILI: se ci sono gia' (rerun, race push/pull_request) il
      # `imagetools create` fallirebbe. Si saltano solo quelli, mentre gli step
      # a valle (log + Trigger INFRA) girano lo stesso: e' cosi' che un rerun
      # ripara un dispatch perso invece di morire sul push.
      - name: Probe pushed tags in registry
        id: probe
        shell: bash
        env:
          IMAGE: ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}
          PRIMARY: ${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}
          ALIAS: ${{ inputs.image_tag }}
        run: |
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1; }

          if exists "$IMAGE:$PRIMARY"; then
            echo "::notice title=Manifest gia' presente::$IMAGE:$PRIMARY e' gia' nel registry"
            echo "manifest_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ALIAS" ] && exists "$IMAGE:$ALIAS"; then
            echo "::warning title=Tag gia' presente::$IMAGE:$ALIAS esiste gia' e i tag ECR sono immutabili: non verra' aggiornato"
            echo "alias_manifest_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "alias_manifest_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6.0.2

      - name: Create combined multi-platform image
        if: steps.probe.outputs.manifest_exists != 'true'
        run: |
          platforms="${{ steps.local_platforms.outputs.LOCAL_PLATFORMS }}"
          tags=""
          for platform in ${platforms//,/ }
          do
            tag="${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}:${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}-${platform##*/}"
            tags="$tags $tag"
          done
          docker buildx imagetools create --tag ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}:${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }} $tags
      
      - name: Tag and push combined image with custom tag
        if: ${{ inputs.image_tag && steps.probe.outputs.alias_manifest_exists != 'true' }}
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}:${{ inputs.image_tag }} \
            ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}:${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}

      - name: Log build to loki
        shell: bash
        run: |
          epoch_time=$(date +%s)
          json_payload=$(cat <<EOF
          {
            "streams": [
              {
                "stream": {
                  "job": "ci",
                  "REPOSITORY": "${{ github.repository }}",
                  "BRANCH": "${{ github.ref_name }}"
                },
                "values": [
                  [
                    "${epoch_time}000000000",
                    "${{ github.repository }}:${{ github.ref_name }}:${{ github.sha }} build completed"
                  ]
                ]
              }
            ]
          }
          EOF
          )
          
          # Send POST request
          curl -X POST -H "Content-Type: application/json" -d "${json_payload}" "http://logging.awms.io:3100/loki/api/v1/push"

      - name: Trigger INFRA
        uses: peter-evans/repository-dispatch@v4.0.1
        if: ${{ inputs.trigger_infra }}
        with:
          token: ${{ secrets.INFRA_TOKEN }}
          repository: i40awms/infra
          event-type: post-build
          client-payload: '{"PROJECT_REF": "${{ github.repository }}", "IMAGE_REF": "${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}", "BRANCH_REF" : "${{ github.ref_name }}"}'
