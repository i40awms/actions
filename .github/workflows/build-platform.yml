# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      cache_key:
        description: "Cache key"
        required: true
        type: string
      image_name:
        description: "Repository short name"
        required: true
        type: string
      in_memory:
        description: "Use in-memory docker"
        required: false
        type: boolean
        default: false
      in_memory_docker_size:
        description: "Use in-memory docker"
        required: false
        type: number
        default: 2
      in_memory_workdir_size:
        description: "Use in-memory docker"
        required: false
        type: number
        default: 1

      dockerfile:
        description: "Dockerfile path"
        required: false
        type: string
        default: "./docker/dockerfile.production"
      context:
        description: "Build context path"
        required: false
        type: string
        default: "."
      platform:
        description: "Target platform"
        required: false
        type: string
        default: ""
      image_tag:
        description: "Override image tag"
        required: false
        type: string
      build-args:
        required: false
        type: string
        default: ""
      no_cache:
        description: "No cache"
        required: false
        type: boolean
        default: false
    secrets:
      IMG_REGISTRY:
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: [self-hosted, linux, heavy, "${{ inputs.platform }}"]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      #  moby/buildkit:local
      - name: copy buildkit
        if: ${{ inputs.in_memory }}
        run: docker save moby/buildkit:local > /tmp/buildkit.tar

      - name: Run Docker on tmpfs
        uses: JonasAlfredsson/docker-on-tmpfs@v1
        if: ${{ inputs.in_memory }}
        with:
          tmpfs_size: ${{ inputs.in_memory_workdir_size }}
          swap_size: 4
          swap_location: "/mnt/swapfile"

      - name: copy buildkit
        if: ${{ inputs.in_memory }}
        run: docker load < /tmp/buildkit.tar

      - name: mount current folder in RAM
        run: sudo mount -t tmpfs -o size=${{ inputs.in_memory_workdir_size }}g tmpfs $(pwd)
        if: ${{ inputs.in_memory }}

      - run: |
          REF_NAME=${REF_NAME##*/}
          echo "REF_NAME=$REF_NAME" >> $GITHUB_OUTPUT
        id: ref_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}

      # I tag dei repository ECR sono IMMUTABILI: ripushare un tag che c'e'
      # gia' fa fallire il push (rerun di un run, race push/pull_request sullo
      # stesso commit). Sondiamo quindi esattamente i tag che lo step di build
      # qui sotto pusherebbe: se il tag identita' <branch>_<sha>-<arch> c'e'
      # gia', quell'immagine e' per costruzione questo commit e la build si
      # salta. Un errore della sonda (registry irraggiungibile) vale
      # "non esiste": si ricade nel comportamento di oggi.
      - name: Probe pushed tags in registry
        id: probe
        shell: bash
        env:
          IMAGE: ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}
          PRIMARY: ${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}-${{ inputs.platform }}
          ALIAS: ${{ inputs.image_tag || format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}-${{ inputs.platform }}
        run: |
          exists() { docker buildx imagetools inspect "$1" >/dev/null 2>&1; }

          if exists "$IMAGE:$PRIMARY"; then
            echo "::notice title=Build saltata::$IMAGE:$PRIMARY e' gia' nel registry"
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
          fi

          # I tag da pushare sono solo quelli che ancora non ci sono: pushare un
          # tag immutabile gia' presente farebbe fallire l'intero step.
          tags="$IMAGE:$PRIMARY"
          if [ "$ALIAS" != "$PRIMARY" ] && ! exists "$IMAGE:$ALIAS"; then
            tags="$tags"$'\n'"$IMAGE:$ALIAS"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6.0.2

      - name: Build Docker image for ${{ inputs.platform }}
        if: steps.probe.outputs.image_exists != 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          no-cache: ${{ inputs.no_cache }}
          file: ${{ inputs.dockerfile }}
          context: ${{ inputs.context }}
          push: true
          load: false
          build-args: |
            IMG_REGISTRY=${{ secrets.IMG_REGISTRY }}
            ${{ inputs.build-args }}
          labels: |
            branch=${{ steps.ref_name.outputs.REF_NAME }} 
            sha=${{ github.sha }}
          tags: ${{ steps.probe.outputs.tags }}
          cache-from: |
            type=registry,ref=${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}-cache:${{ steps.ref_name.outputs.REF_NAME }}-${{ inputs.platform }}
            type=registry,ref=${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}-cache:develop-${{ inputs.platform }}
          cache-to: mode=max,image-manifest=true,oci-mediatypes=true,type=registry,ref=${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}-cache:${{ steps.ref_name.outputs.REF_NAME }}-${{ inputs.platform }}

      # Se la build e' stata saltata, l'alias (image_tag oppure
      # <sha>-<run_id>-<attempt>) non e' stato pushato da nessuno: lo si crea
      # lato registry dal tag identita', senza ricostruire niente. No-op quando
      # la build e' girata davvero (l'alias c'e' gia').
      - name: Re-tag existing image (no rebuild)
        if: steps.probe.outputs.image_exists == 'true'
        shell: bash
        env:
          IMAGE: ${{ secrets.IMG_REGISTRY }}/${{ inputs.image_name }}
          PRIMARY: ${{ steps.ref_name.outputs.REF_NAME }}_${{ github.sha }}-${{ inputs.platform }}
          ALIAS: ${{ inputs.image_tag || format('{0}-{1}-{2}', github.sha, github.run_id, github.run_attempt) }}-${{ inputs.platform }}
        run: |
          if [ "$ALIAS" = "$PRIMARY" ]; then
            exit 0
          fi
          if docker buildx imagetools inspect "$IMAGE:$ALIAS" >/dev/null 2>&1; then
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:$ALIAS" "$IMAGE:$PRIMARY"
